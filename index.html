<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Flappy Bird Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(180deg, #4ec0ca 0%, #87ceeb 100%);
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            box-shadow: 0 10px 50px rgba(0, 0, 0, 0.3);
        }

        #gameCanvas {
            display: block;
            background: #4ec0ca;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        #muteButton {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.3);
            border: 2px solid white;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 18px;
            z-index: 10;
            transition: background 0.2s;
        }

        #muteButton:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        #muteButton:active {
            transform: scale(0.95);
        }

        #jumpscare {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1000;
            display: none;
            pointer-events: none;
            background: #000;
        }

        #jumpscare.active {
            display: block;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="360" height="540"></canvas>
        <button id="muteButton">🔊</button>
    </div>
    <canvas id="jumpscare"></canvas>

    <script>
        // ========================================
        // GAME CONFIGURATION & CONSTANTS
        // ========================================

        const CONFIG = {
            // Canvas dimensions
            WIDTH: 360,
            HEIGHT: 540,

            // Bird physics
            GRAVITY: 0.5,              // Downward acceleration per frame
            FLAP_POWER: -8.5,          // Upward velocity on flap
            MAX_FALL_SPEED: 10,        // Terminal velocity
            BIRD_X: 80,                // Fixed horizontal position
            BIRD_Y_START: 200,         // Starting vertical position
            BIRD_RADIUS: 12,           // Collision radius
            BIRD_RENDER_SIZE: 24,      // Visual size

            // Rotation
            MAX_ROTATION_UP: -25,      // Degrees when flying up
            MAX_ROTATION_DOWN: 90,     // Degrees when falling
            ROTATION_SPEED: 3,         // How fast bird rotates

            // Pipes
            PIPE_WIDTH: 52,
            PIPE_GAP: 140,             // Vertical gap between pipes
            PIPE_SPEED: 2,             // Horizontal scroll speed
            PIPE_SPAWN_INTERVAL: 90,   // Frames between pipe spawns
            PIPE_MIN_HEIGHT: 60,       // Minimum pipe height from top/bottom

            // Ground
            GROUND_HEIGHT: 100,
            GROUND_SCROLL_SPEED: 2,

            // Scoring
            MEDAL_BRONZE: 10,
            MEDAL_SILVER: 20,
            MEDAL_GOLD: 30,
            MEDAL_PLATINUM: 40,

            // Animation
            FLAP_ANIMATION_SPEED: 8,   // Frames per wing position
            BOB_SPEED: 0.05,           // Speed of bobbing on start screen
            BOB_AMOUNT: 10,            // Pixels of bobbing amplitude
        };

        // ========================================
        // AUDIO SYSTEM
        // ========================================

        class AudioSystem {
            constructor() {
                this.muted = false;
                this.context = null;
                this.sounds = {};
                this.initAudio();
            }

            initAudio() {
                try {
                    this.context = new (window.AudioContext || window.webkitAudioContext)();
                    this.createSounds();
                } catch (e) {
                    console.warn('Web Audio API not supported');
                }
            }

            createSounds() {
                // Simple procedural sounds using oscillators
                this.sounds = {
                    flap: () => this.playTone(300, 0.1, 'sine'),
                    point: () => this.playTone(600, 0.15, 'square'),
                    hit: () => this.playTone(100, 0.2, 'sawtooth'),
                    die: () => this.playTone(150, 0.3, 'triangle'),
                    swoosh: () => this.playTone(200, 0.1, 'sine')
                };
            }

            playTone(frequency, duration, type = 'sine') {
                if (this.muted || !this.context) return;

                try {
                    const oscillator = this.context.createOscillator();
                    const gainNode = this.context.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(this.context.destination);

                    oscillator.frequency.value = frequency;
                    oscillator.type = type;

                    gainNode.gain.setValueAtTime(0.1, this.context.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, this.context.currentTime + duration);

                    oscillator.start(this.context.currentTime);
                    oscillator.stop(this.context.currentTime + duration);
                } catch (e) {
                    console.warn('Error playing sound:', e);
                }
            }

            // Loud, distorted procedural scream for the death jumpscare
            playScream() {
                if (this.muted || !this.context) return;
                const ctx = this.context;
                const now = ctx.currentTime;
                const dur = 1.8;

                try {
                    // Master chain: gain -> limiter so it is LOUD but doesn't clip into garbage
                    const master = ctx.createGain();
                    master.gain.setValueAtTime(0.0001, now);
                    master.gain.exponentialRampToValueAtTime(1.0, now + 0.02);
                    master.gain.setValueAtTime(1.0, now + dur - 0.4);
                    master.gain.exponentialRampToValueAtTime(0.0001, now + dur);

                    const limiter = ctx.createDynamicsCompressor();
                    limiter.threshold.value = -6;
                    limiter.knee.value = 0;
                    limiter.ratio.value = 20;
                    limiter.attack.value = 0.001;
                    limiter.release.value = 0.1;
                    master.connect(limiter);
                    limiter.connect(ctx.destination);

                    // Distortion curve
                    const shaper = ctx.createWaveShaper();
                    const n = 2048, k = 400;
                    const curve = new Float32Array(n);
                    for (let i = 0; i < n; i++) {
                        const x = (i * 2) / n - 1;
                        curve[i] = ((3 + k) * x * 20 * Math.PI / 180) / (Math.PI + k * Math.abs(x));
                    }
                    shaper.curve = curve;
                    shaper.oversample = '4x';
                    shaper.connect(master);

                    // Shrieking voice: detuned sawtooths with wild vibrato
                    const voiceBus = ctx.createGain();
                    voiceBus.gain.value = 0.5;
                    const bp = ctx.createBiquadFilter();
                    bp.type = 'bandpass';
                    bp.frequency.setValueAtTime(1800, now);
                    bp.Q.value = 1.2;
                    voiceBus.connect(bp);
                    bp.connect(shaper);

                    const lfo = ctx.createOscillator();
                    lfo.frequency.setValueAtTime(18, now);
                    lfo.frequency.linearRampToValueAtTime(35, now + dur);
                    const lfoGain = ctx.createGain();
                    lfoGain.gain.value = 120;
                    lfo.connect(lfoGain);

                    [0.97, 1.0, 1.03, 1.51, 2.02].forEach(mult => {
                        const o = ctx.createOscillator();
                        o.type = 'sawtooth';
                        o.frequency.setValueAtTime(500 * mult, now);
                        o.frequency.exponentialRampToValueAtTime(1400 * mult, now + 0.15);
                        o.frequency.exponentialRampToValueAtTime(1100 * mult, now + 0.9);
                        o.frequency.exponentialRampToValueAtTime(300 * mult, now + dur);
                        lfoGain.connect(o.frequency);
                        o.connect(voiceBus);
                        o.start(now);
                        o.stop(now + dur);
                    });
                    lfo.start(now);
                    lfo.stop(now + dur);

                    // Harsh noise burst
                    const noiseLen = Math.floor(ctx.sampleRate * dur);
                    const buf = ctx.createBuffer(1, noiseLen, ctx.sampleRate);
                    const data = buf.getChannelData(0);
                    for (let i = 0; i < noiseLen; i++) data[i] = Math.random() * 2 - 1;
                    const noise = ctx.createBufferSource();
                    noise.buffer = buf;
                    const noiseGain = ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.9, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.25, now + 0.4);
                    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + dur);
                    const hp = ctx.createBiquadFilter();
                    hp.type = 'highpass';
                    hp.frequency.value = 900;
                    noise.connect(hp);
                    hp.connect(noiseGain);
                    noiseGain.connect(shaper);
                    noise.start(now);

                    // Metallic screech on top
                    const screech = ctx.createOscillator();
                    screech.type = 'square';
                    screech.frequency.setValueAtTime(3200, now);
                    screech.frequency.linearRampToValueAtTime(2400, now + dur);
                    const screechMod = ctx.createOscillator();
                    screechMod.frequency.value = 73;
                    const screechModGain = ctx.createGain();
                    screechModGain.gain.value = 900;
                    screechMod.connect(screechModGain);
                    screechModGain.connect(screech.frequency);
                    const screechGain = ctx.createGain();
                    screechGain.gain.value = 0.12;
                    screech.connect(screechGain);
                    screechGain.connect(shaper);
                    screech.start(now);
                    screechMod.start(now);
                    screech.stop(now + dur);
                    screechMod.stop(now + dur);

                    // Gut-punch sub boom (bypasses distortion)
                    const boom = ctx.createOscillator();
                    boom.type = 'sine';
                    boom.frequency.setValueAtTime(120, now);
                    boom.frequency.exponentialRampToValueAtTime(30, now + 0.6);
                    const boomGain = ctx.createGain();
                    boomGain.gain.setValueAtTime(1.0, now);
                    boomGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.8);
                    boom.connect(boomGain);
                    boomGain.connect(master);
                    boom.start(now);
                    boom.stop(now + 0.8);
                } catch (e) {
                    console.warn('Error playing scream:', e);
                }
            }

            play(soundName) {
                if (this.sounds[soundName]) {
                    this.sounds[soundName]();
                }
            }

            toggle() {
                this.muted = !this.muted;
                return this.muted;
            }
        }

        // ========================================
        // BIRD CLASS
        // ========================================

        class Bird {
            constructor() {
                this.reset();
                this.flapFrame = 0;
                this.rotation = 0;
            }

            reset() {
                this.x = CONFIG.BIRD_X;
                this.y = CONFIG.BIRD_Y_START;
                this.vy = 0;
                this.rotation = 0;
            }

            flap() {
                this.vy = CONFIG.FLAP_POWER;
            }

            update() {
                // Apply gravity
                this.vy += CONFIG.GRAVITY;

                // Cap fall speed
                if (this.vy > CONFIG.MAX_FALL_SPEED) {
                    this.vy = CONFIG.MAX_FALL_SPEED;
                }

                // Update position
                this.y += this.vy;

                // Update rotation based on velocity
                if (this.vy < 0) {
                    this.rotation = Math.max(CONFIG.MAX_ROTATION_UP, this.rotation - CONFIG.ROTATION_SPEED);
                } else {
                    this.rotation = Math.min(CONFIG.MAX_ROTATION_DOWN, this.rotation + CONFIG.ROTATION_SPEED);
                }
            }

            draw(ctx, frameCount) {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);

                // Wing flap animation
                this.flapFrame = Math.floor(frameCount / CONFIG.FLAP_ANIMATION_SPEED) % 3;
                const wingOffset = this.flapFrame === 1 ? -2 : 0;

                // Draw bird body
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(0, 0, CONFIG.BIRD_RADIUS, 0, Math.PI * 2);
                ctx.fill();

                // Draw bird eye
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(5, -3, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = 'black';
                ctx.beginPath();
                ctx.arc(6, -3, 2, 0, Math.PI * 2);
                ctx.fill();

                // Draw beak
                ctx.fillStyle = '#FF6347';
                ctx.beginPath();
                ctx.moveTo(10, 0);
                ctx.lineTo(16, -2);
                ctx.lineTo(16, 2);
                ctx.closePath();
                ctx.fill();

                // Draw wing
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.ellipse(-2, 2 + wingOffset, 8, 5, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }

            drawBobbing(ctx, frameCount) {
                // Draw bird with gentle bobbing motion on start screen
                const bobOffset = Math.sin(frameCount * CONFIG.BOB_SPEED) * CONFIG.BOB_AMOUNT;
                ctx.save();
                ctx.translate(0, bobOffset);
                this.draw(ctx, frameCount);
                ctx.restore();
            }

            getBounds() {
                return {
                    x: this.x,
                    y: this.y,
                    radius: CONFIG.BIRD_RADIUS - 2  // Slightly smaller hitbox for fairness
                };
            }
        }

        // ========================================
        // PIPE CLASS
        // ========================================

        class Pipe {
            constructor(x) {
                this.x = x;
                this.scored = false;

                // Random gap position
                const minGapY = CONFIG.PIPE_MIN_HEIGHT + CONFIG.PIPE_GAP / 2;
                const maxGapY = CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT - CONFIG.PIPE_MIN_HEIGHT - CONFIG.PIPE_GAP / 2;
                this.gapY = minGapY + Math.random() * (maxGapY - minGapY);
            }

            update() {
                this.x -= CONFIG.PIPE_SPEED;
            }

            draw(ctx) {
                const topHeight = this.gapY - CONFIG.PIPE_GAP / 2;
                const bottomY = this.gapY + CONFIG.PIPE_GAP / 2;
                const bottomHeight = CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT - bottomY;

                // Pipe color gradient
                const gradient = ctx.createLinearGradient(this.x, 0, this.x + CONFIG.PIPE_WIDTH, 0);
                gradient.addColorStop(0, '#4CAF50');
                gradient.addColorStop(0.5, '#66BB6A');
                gradient.addColorStop(1, '#4CAF50');

                // Top pipe
                ctx.fillStyle = gradient;
                ctx.fillRect(this.x, 0, CONFIG.PIPE_WIDTH, topHeight);
                ctx.strokeStyle = '#2E7D32';
                ctx.lineWidth = 3;
                ctx.strokeRect(this.x, 0, CONFIG.PIPE_WIDTH, topHeight);

                // Top pipe cap
                ctx.fillStyle = '#66BB6A';
                ctx.fillRect(this.x - 3, topHeight - 20, CONFIG.PIPE_WIDTH + 6, 20);
                ctx.strokeRect(this.x - 3, topHeight - 20, CONFIG.PIPE_WIDTH + 6, 20);

                // Bottom pipe
                ctx.fillStyle = gradient;
                ctx.fillRect(this.x, bottomY, CONFIG.PIPE_WIDTH, bottomHeight);
                ctx.strokeRect(this.x, bottomY, CONFIG.PIPE_WIDTH, bottomHeight);

                // Bottom pipe cap
                ctx.fillStyle = '#66BB6A';
                ctx.fillRect(this.x - 3, bottomY, CONFIG.PIPE_WIDTH + 6, 20);
                ctx.strokeRect(this.x - 3, bottomY, CONFIG.PIPE_WIDTH + 6, 20);
            }

            isOffscreen() {
                return this.x + CONFIG.PIPE_WIDTH < 0;
            }

            collidesWith(bird) {
                const bounds = bird.getBounds();

                // Check if bird is horizontally aligned with pipe
                if (bounds.x + bounds.radius > this.x && bounds.x - bounds.radius < this.x + CONFIG.PIPE_WIDTH) {
                    const topPipeBottom = this.gapY - CONFIG.PIPE_GAP / 2;
                    const bottomPipeTop = this.gapY + CONFIG.PIPE_GAP / 2;

                    // Check collision with top or bottom pipe
                    if (bounds.y - bounds.radius < topPipeBottom || bounds.y + bounds.radius > bottomPipeTop) {
                        return true;
                    }
                }
                return false;
            }

            hasPassed(bird) {
                return bird.x > this.x + CONFIG.PIPE_WIDTH && !this.scored;
            }
        }

        // ========================================
        // JUMPSCARE
        // ========================================

        class Jumpscare {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.active = false;
                this.start = 0;
                this.duration = 1700; // ms
                this.onDone = null;

                // Low-res buffer for TV static
                this.noise = document.createElement('canvas');
                this.noise.width = 160;
                this.noise.height = 120;
                this.noiseCtx = this.noise.getContext('2d');
                this.noiseImg = this.noiseCtx.createImageData(160, 120);
            }

            trigger(onDone) {
                this.canvas.width = window.innerWidth;
                this.canvas.height = window.innerHeight;
                this.canvas.classList.add('active');
                this.active = true;
                this.start = performance.now();
                this.onDone = onDone;
                if (navigator.vibrate) navigator.vibrate([300, 50, 400]);
                requestAnimationFrame(() => this.frame());
            }

            frame() {
                if (!this.active) return;
                const t = performance.now() - this.start;
                if (t >= this.duration) {
                    this.active = false;
                    this.canvas.classList.remove('active');
                    if (this.onDone) this.onDone();
                    return;
                }
                this.draw(t);
                requestAnimationFrame(() => this.frame());
            }

            drawStatic(alpha) {
                const d = this.noiseImg.data;
                for (let i = 0; i < d.length; i += 4) {
                    const v = Math.random() * 255;
                    d[i] = v; d[i + 1] = v * 0.6; d[i + 2] = v * 0.6; d[i + 3] = 255;
                }
                this.noiseCtx.putImageData(this.noiseImg, 0, 0);
                const ctx = this.ctx;
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(this.noise, 0, 0, this.canvas.width, this.canvas.height);
                ctx.restore();
            }

            draw(t) {
                const ctx = this.ctx;
                const W = this.canvas.width, H = this.canvas.height;
                const p = t / this.duration;

                // Strobing background: black / blood red / white flash
                const strobe = Math.floor(t / 45) % 7;
                ctx.fillStyle = t < 60 ? '#fff' : strobe === 0 ? '#600' : strobe === 3 ? '#fff' : '#000';
                ctx.fillRect(0, 0, W, H);

                // Face lunges at the camera then keeps creeping closer
                const lunge = t < 140 ? 0.2 + (t / 140) * 1.0 : 1.2 + p * 0.35;
                const size = Math.min(W, H) * 0.55 * lunge;
                const shake = 30 * (1 - p * 0.5);
                const cx = W / 2 + (Math.random() - 0.5) * shake;
                const cy = H / 2 + (Math.random() - 0.5) * shake;

                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate((Math.random() - 0.5) * 0.12);
                ctx.scale(1 + (Math.random() - 0.5) * 0.08, 1 + (Math.random() - 0.5) * 0.08);

                // Red glow behind head
                const glow = ctx.createRadialGradient(0, 0, size * 0.3, 0, 0, size * 1.6);
                glow.addColorStop(0, 'rgba(180,0,0,0.9)');
                glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(-size * 2, -size * 2, size * 4, size * 4);

                // Gaunt, pale skull-face
                const skin = ctx.createRadialGradient(0, -size * 0.2, size * 0.1, 0, 0, size);
                skin.addColorStop(0, '#d8d2c0');
                skin.addColorStop(0.6, '#8a8270');
                skin.addColorStop(1, '#2a2418');
                ctx.fillStyle = skin;
                ctx.beginPath();
                ctx.moveTo(0, -size);
                ctx.bezierCurveTo(size * 0.85, -size, size * 0.8, -size * 0.1, size * 0.55, size * 0.5);
                ctx.bezierCurveTo(size * 0.4, size * 0.95, size * 0.15, size * 1.1, 0, size * 1.1);
                ctx.bezierCurveTo(-size * 0.15, size * 1.1, -size * 0.4, size * 0.95, -size * 0.55, size * 0.5);
                ctx.bezierCurveTo(-size * 0.8, -size * 0.1, -size * 0.85, -size, 0, -size);
                ctx.fill();

                // Sunken eye sockets
                [-1, 1].forEach(side => {
                    const ex = side * size * 0.27, ey = -size * 0.22;
                    const sock = ctx.createRadialGradient(ex, ey, 0, ex, ey, size * 0.26);
                    sock.addColorStop(0, '#000');
                    sock.addColorStop(0.7, '#000');
                    sock.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = sock;
                    ctx.beginPath();
                    ctx.ellipse(ex, ey, size * 0.24, size * 0.2, side * 0.3, 0, Math.PI * 2);
                    ctx.fill();

                    // Tiny glowing pupils, darting
                    const px = ex + (Math.random() - 0.5) * size * 0.03;
                    const py = ey + (Math.random() - 0.5) * size * 0.03;
                    ctx.shadowColor = '#f00';
                    ctx.shadowBlur = size * 0.15;
                    ctx.fillStyle = '#ff2a00';
                    ctx.beginPath();
                    ctx.arc(px, py, size * 0.035, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(px, py, size * 0.012, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    // Bloody tears
                    ctx.fillStyle = '#7a0000';
                    const drip = size * (0.2 + p * 0.6);
                    ctx.fillRect(ex - size * 0.02 + side * size * 0.05, ey + size * 0.15, size * 0.035, drip);
                });

                // Nose cavity
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.moveTo(0, -size * 0.02);
                ctx.lineTo(size * 0.08, size * 0.17);
                ctx.lineTo(-size * 0.08, size * 0.17);
                ctx.closePath();
                ctx.fill();

                // Huge screaming mouth, stretching open
                const open = 0.35 + 0.2 * Math.min(1, t / 300) + Math.random() * 0.05;
                const my = size * 0.55;
                ctx.fillStyle = '#0a0000';
                ctx.beginPath();
                ctx.ellipse(0, my, size * 0.3, size * open, 0, 0, Math.PI * 2);
                ctx.fill();
                const throat = ctx.createRadialGradient(0, my + size * 0.1, 0, 0, my, size * open);
                throat.addColorStop(0, '#300');
                throat.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = throat;
                ctx.fill();

                // Jagged teeth
                ctx.fillStyle = '#e8e0c0';
                const teeth = 9;
                for (let i = 0; i < teeth; i++) {
                    const a0 = Math.PI + (i / teeth) * Math.PI;
                    const a1 = Math.PI + ((i + 1) / teeth) * Math.PI;
                    const am = (a0 + a1) / 2;
                    const rx = size * 0.3, ry = size * open;
                    const len = 0.35 + (i % 2) * 0.25;
                    // top row
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a0) * rx, my + Math.sin(a0) * ry);
                    ctx.lineTo(Math.cos(a1) * rx, my + Math.sin(a1) * ry);
                    ctx.lineTo(Math.cos(am) * rx * (1 - len * 0.4), my + Math.sin(am) * ry * (1 - len));
                    ctx.fill();
                    // bottom row
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(a0) * rx, my - Math.sin(a0) * ry);
                    ctx.lineTo(Math.cos(a1) * rx, my - Math.sin(a1) * ry);
                    ctx.lineTo(Math.cos(am) * rx * (1 - len * 0.4), my - Math.sin(am) * ry * (1 - len));
                    ctx.fill();
                }

                // Cracks across the face
                ctx.strokeStyle = 'rgba(20,0,0,0.8)';
                ctx.lineWidth = Math.max(2, size * 0.008);
                ctx.beginPath();
                ctx.moveTo(-size * 0.1, -size * 0.95);
                ctx.lineTo(-size * 0.05, -size * 0.6);
                ctx.lineTo(-size * 0.18, -size * 0.45);
                ctx.moveTo(size * 0.35, -size * 0.7);
                ctx.lineTo(size * 0.5, -size * 0.4);
                ctx.lineTo(size * 0.45, -size * 0.1);
                ctx.stroke();

                ctx.restore();

                // Blood vignette
                const vig = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
                vig.addColorStop(0, 'rgba(0,0,0,0)');
                vig.addColorStop(1, 'rgba(90,0,0,0.95)');
                ctx.fillStyle = vig;
                ctx.fillRect(0, 0, W, H);

                // Scanline glitch tears
                for (let i = 0; i < 6; i++) {
                    if (Math.random() < 0.5) {
                        const y = Math.random() * H, h = 4 + Math.random() * 30;
                        const dx = (Math.random() - 0.5) * 80;
                        ctx.drawImage(this.canvas, 0, y, W, h, dx, y, W, h);
                    }
                }

                // TV static, heavier as it fades out
                this.drawStatic(0.12 + (p > 0.8 ? (p - 0.8) * 4 : 0) + (Math.random() < 0.1 ? 0.4 : 0));

                // Random colour inversion flashes
                if (Math.random() < 0.08) {
                    ctx.save();
                    ctx.globalCompositeOperation = 'difference';
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, W, H);
                    ctx.restore();
                }
            }
        }

        // ========================================
        // GAME CLASS
        // ========================================

        class Game {
            constructor(canvas) {
                this.canvas = canvas;
                this.ctx = canvas.getContext('2d');
                this.audio = new AudioSystem();
                this.jumpscare = new Jumpscare(document.getElementById('jumpscare'));
                this.scaring = false;

                // Game state
                this.state = 'START';  // START, PLAYING, GAMEOVER
                this.frameCount = 0;
                this.score = 0;
                this.bestScore = this.loadBestScore();

                // Game objects
                this.bird = new Bird();
                this.pipes = [];
                this.framesSinceLastPipe = 0;
                this.groundOffset = 0;

                // Animation
                this.gameOverDelay = 0;

                this.setupInput();
                this.gameLoop();
            }

            loadBestScore() {
                const saved = localStorage.getItem('flappyBestScore');
                return saved ? parseInt(saved) : 0;
            }

            saveBestScore() {
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('flappyBestScore', this.bestScore.toString());
                }
            }

            setupInput() {
                // Keyboard
                document.addEventListener('keydown', (e) => {
                    if (e.code === 'Space') {
                        e.preventDefault();
                        this.handleInput();
                    }
                });

                // Mouse
                this.canvas.addEventListener('click', () => {
                    this.handleInput();
                });

                // Touch
                this.canvas.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.handleInput();
                });
            }

            handleInput() {
                // Resume audio context on first interaction (browser requirement)
                if (this.audio.context && this.audio.context.state === 'suspended') {
                    this.audio.context.resume();
                }

                if (this.state === 'START') {
                    this.startGame();
                } else if (this.state === 'PLAYING') {
                    this.bird.flap();
                    this.audio.play('flap');
                } else if (this.state === 'GAMEOVER' && !this.scaring && this.gameOverDelay > 30) {
                    this.resetGame();
                }
            }

            startGame() {
                this.state = 'PLAYING';
                this.bird.flap();
                this.audio.play('flap');
            }

            resetGame() {
                this.state = 'START';
                this.score = 0;
                this.bird.reset();
                this.pipes = [];
                this.framesSinceLastPipe = 0;
                this.groundOffset = 0;
                this.gameOverDelay = 0;
            }

            update() {
                this.frameCount++;

                if (this.state === 'PLAYING') {
                    // Update bird
                    this.bird.update();

                    // Update pipes
                    this.pipes.forEach(pipe => pipe.update());

                    // Spawn new pipes
                    this.framesSinceLastPipe++;
                    if (this.framesSinceLastPipe >= CONFIG.PIPE_SPAWN_INTERVAL) {
                        this.pipes.push(new Pipe(CONFIG.WIDTH));
                        this.framesSinceLastPipe = 0;
                    }

                    // Remove offscreen pipes
                    this.pipes = this.pipes.filter(pipe => !pipe.isOffscreen());

                    // Update ground scroll
                    this.groundOffset -= CONFIG.GROUND_SCROLL_SPEED;
                    if (this.groundOffset <= -50) {
                        this.groundOffset = 0;
                    }

                    // Check scoring
                    this.pipes.forEach(pipe => {
                        if (pipe.hasPassed(this.bird)) {
                            pipe.scored = true;
                            this.score++;
                            this.audio.play('point');
                        }
                    });

                    // Check collisions
                    this.checkCollisions();

                } else if (this.state === 'START') {
                    // Gentle ground scroll on start screen
                    this.groundOffset -= CONFIG.GROUND_SCROLL_SPEED * 0.5;
                    if (this.groundOffset <= -50) {
                        this.groundOffset = 0;
                    }
                } else if (this.state === 'GAMEOVER' && !this.scaring) {
                    this.gameOverDelay++;
                }
            }

            checkCollisions() {
                const bounds = this.bird.getBounds();

                // Check ground collision
                if (bounds.y + bounds.radius >= CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT) {
                    this.gameOver();
                    return;
                }

                // Check ceiling collision
                if (bounds.y - bounds.radius <= 0) {
                    this.gameOver();
                    return;
                }

                // Check pipe collisions
                for (let pipe of this.pipes) {
                    if (pipe.collidesWith(this.bird)) {
                        this.gameOver();
                        return;
                    }
                }
            }

            gameOver() {
                this.state = 'GAMEOVER';
                this.gameOverDelay = 0;
                this.saveBestScore();
                this.audio.play('hit');
                this.audio.playScream();
                this.scaring = true;
                this.jumpscare.trigger(() => {
                    this.scaring = false;
                    this.audio.play('swoosh');
                });
            }

            draw() {
                // Clear canvas
                this.ctx.clearRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

                // Draw background
                this.drawBackground();

                // Draw pipes
                this.pipes.forEach(pipe => pipe.draw(this.ctx));

                // Draw ground
                this.drawGround();

                // Draw bird
                if (this.state === 'START') {
                    this.bird.drawBobbing(this.ctx, this.frameCount);
                } else {
                    this.bird.draw(this.ctx, this.frameCount);
                }

                // Draw UI
                if (this.state === 'START') {
                    this.drawStartScreen();
                } else if (this.state === 'PLAYING') {
                    this.drawScore();
                } else if (this.state === 'GAMEOVER') {
                    this.drawScore();
                    this.drawGameOverScreen();
                }
            }

            drawBackground() {
                // Sky gradient
                const gradient = this.ctx.createLinearGradient(0, 0, 0, CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT);
                gradient.addColorStop(0, '#4ec0ca');
                gradient.addColorStop(1, '#87ceeb');
                this.ctx.fillStyle = gradient;
                this.ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT);

                // Clouds
                this.ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                const cloudOffset = (this.frameCount * 0.2) % (CONFIG.WIDTH + 100);
                this.drawCloud(cloudOffset - 100, 60);
                this.drawCloud(cloudOffset + 50, 120);
                this.drawCloud(cloudOffset + 200, 80);
            }

            drawCloud(x, y) {
                this.ctx.beginPath();
                this.ctx.arc(x, y, 20, 0, Math.PI * 2);
                this.ctx.arc(x + 25, y, 25, 0, Math.PI * 2);
                this.ctx.arc(x + 50, y, 20, 0, Math.PI * 2);
                this.ctx.fill();
            }

            drawGround() {
                const groundY = CONFIG.HEIGHT - CONFIG.GROUND_HEIGHT;

                // Ground color
                this.ctx.fillStyle = '#DEB887';
                this.ctx.fillRect(0, groundY, CONFIG.WIDTH, CONFIG.GROUND_HEIGHT);

                // Ground pattern (repeating tiles)
                this.ctx.fillStyle = '#CD853F';
                for (let x = this.groundOffset; x < CONFIG.WIDTH; x += 50) {
                    for (let y = groundY; y < CONFIG.HEIGHT; y += 50) {
                        this.ctx.fillRect(x, y, 20, 20);
                        this.ctx.fillRect(x + 25, y + 25, 20, 20);
                    }
                }

                // Ground border
                this.ctx.strokeStyle = '#8B4513';
                this.ctx.lineWidth = 3;
                this.ctx.beginPath();
                this.ctx.moveTo(0, groundY);
                this.ctx.lineTo(CONFIG.WIDTH, groundY);
                this.ctx.stroke();
            }

            drawScore() {
                this.ctx.fillStyle = 'white';
                this.ctx.strokeStyle = 'black';
                this.ctx.lineWidth = 4;
                this.ctx.font = 'bold 48px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'top';

                const scoreText = this.score.toString();
                this.ctx.strokeText(scoreText, CONFIG.WIDTH / 2, 50);
                this.ctx.fillText(scoreText, CONFIG.WIDTH / 2, 50);
            }

            drawStartScreen() {
                // Game title
                this.ctx.fillStyle = 'white';
                this.ctx.strokeStyle = 'black';
                this.ctx.lineWidth = 5;
                this.ctx.font = 'bold 48px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.strokeText('Flappy Bird', CONFIG.WIDTH / 2, 80);
                this.ctx.fillText('Flappy Bird', CONFIG.WIDTH / 2, 80);

                // Get Ready message
                this.ctx.font = 'bold 24px Arial';
                this.ctx.lineWidth = 3;
                this.ctx.strokeText('Get Ready!', CONFIG.WIDTH / 2, 180);
                this.ctx.fillText('Get Ready!', CONFIG.WIDTH / 2, 180);

                // Instructions
                this.ctx.font = '18px Arial';
                this.ctx.lineWidth = 2;
                const instructions = 'Tap, Click, or Press Space';
                this.ctx.strokeText(instructions, CONFIG.WIDTH / 2, 350);
                this.ctx.fillText(instructions, CONFIG.WIDTH / 2, 350);
            }

            drawGameOverScreen() {
                if (this.gameOverDelay < 20) return;

                // Semi-transparent overlay
                this.ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
                this.ctx.fillRect(0, 0, CONFIG.WIDTH, CONFIG.HEIGHT);

                // Game Over panel
                const panelWidth = 280;
                const panelHeight = 240;
                const panelX = (CONFIG.WIDTH - panelWidth) / 2;
                const panelY = 150;

                // Panel background
                this.ctx.fillStyle = '#F5DEB3';
                this.ctx.strokeStyle = '#8B4513';
                this.ctx.lineWidth = 4;
                this.roundRect(panelX, panelY, panelWidth, panelHeight, 10);
                this.ctx.fill();
                this.ctx.stroke();

                // Game Over text
                this.ctx.fillStyle = '#8B4513';
                this.ctx.font = 'bold 36px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.fillText('Game Over', CONFIG.WIDTH / 2, panelY + 30);

                // Score section
                this.ctx.font = 'bold 20px Arial';
                this.ctx.textAlign = 'left';

                const leftMargin = panelX + 30;
                let yPos = panelY + 80;

                this.ctx.fillText('Score:', leftMargin, yPos);
                this.ctx.textAlign = 'right';
                this.ctx.fillText(this.score.toString(), panelX + panelWidth - 30, yPos);

                yPos += 35;
                this.ctx.textAlign = 'left';
                this.ctx.fillText('Best:', leftMargin, yPos);
                this.ctx.textAlign = 'right';
                this.ctx.fillText(this.bestScore.toString(), panelX + panelWidth - 30, yPos);

                // Medal
                yPos += 40;
                const medal = this.getMedal();
                if (medal) {
                    this.ctx.textAlign = 'center';
                    this.ctx.font = '48px Arial';
                    this.ctx.fillText(medal.emoji, CONFIG.WIDTH / 2, yPos);
                    this.ctx.font = 'bold 16px Arial';
                    this.ctx.fillText(medal.name, CONFIG.WIDTH / 2, yPos + 40);
                }

                // Replay instruction
                this.ctx.fillStyle = 'white';
                this.ctx.strokeStyle = 'black';
                this.ctx.lineWidth = 2;
                this.ctx.font = '18px Arial';
                this.ctx.textAlign = 'center';
                this.ctx.strokeText('Tap to Replay', CONFIG.WIDTH / 2, panelY + panelHeight + 40);
                this.ctx.fillText('Tap to Replay', CONFIG.WIDTH / 2, panelY + panelHeight + 40);
            }

            getMedal() {
                if (this.score >= CONFIG.MEDAL_PLATINUM) {
                    return { name: 'Platinum', emoji: '💎' };
                } else if (this.score >= CONFIG.MEDAL_GOLD) {
                    return { name: 'Gold', emoji: '🥇' };
                } else if (this.score >= CONFIG.MEDAL_SILVER) {
                    return { name: 'Silver', emoji: '🥈' };
                } else if (this.score >= CONFIG.MEDAL_BRONZE) {
                    return { name: 'Bronze', emoji: '🥉' };
                }
                return null;
            }

            roundRect(x, y, width, height, radius) {
                this.ctx.beginPath();
                this.ctx.moveTo(x + radius, y);
                this.ctx.lineTo(x + width - radius, y);
                this.ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
                this.ctx.lineTo(x + width, y + height - radius);
                this.ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                this.ctx.lineTo(x + radius, y + height);
                this.ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
                this.ctx.lineTo(x, y + radius);
                this.ctx.quadraticCurveTo(x, y, x + radius, y);
                this.ctx.closePath();
            }

            gameLoop() {
                this.update();
                this.draw();
                requestAnimationFrame(() => this.gameLoop());
            }
        }

        // ========================================
        // INITIALIZATION
        // ========================================

        const canvas = document.getElementById('gameCanvas');
        const game = new Game(canvas);

        // Mute button functionality
        const muteButton = document.getElementById('muteButton');
        muteButton.addEventListener('click', () => {
            const muted = game.audio.toggle();
            muteButton.textContent = muted ? '🔇' : '🔊';
        });

        // Prevent context menu on right-click
        canvas.addEventListener('contextmenu', (e) => e.preventDefault());

        // Handle window resize (maintain aspect ratio)
        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const windowRatio = window.innerWidth / window.innerHeight;
            const gameRatio = CONFIG.WIDTH / CONFIG.HEIGHT;

            if (windowRatio > gameRatio) {
                // Window is wider, fit to height
                const scale = Math.min(window.innerHeight * 0.9 / CONFIG.HEIGHT, 1.5);
                container.style.transform = `scale(${scale})`;
            } else {
                // Window is taller, fit to width
                const scale = Math.min(window.innerWidth * 0.9 / CONFIG.WIDTH, 1.5);
                container.style.transform = `scale(${scale})`;
            }
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();
    </script>
